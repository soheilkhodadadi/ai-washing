[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-washing-v43-handoff"
version = "0.1.0"
description = "Curated AI Washing v4.3 computational handoff capsule"
requires-python = ">=3.10"
dependencies = [
  "pandas",
  "numpy",
  "scipy",
  "statsmodels",
  "matplotlib",
  "python-docx",
  "python-dotenv",
  "psycopg2-binary",
  "pyarrow",
]

[tool.setuptools.packages.find]
where = ["src"]
