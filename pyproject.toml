[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-washing"
version = "0.1.0"
description = "Canonical research workstation for the AI Washing project"
requires-python = ">=3.10,<3.12"
dependencies = [
  "pandas==2.2.3",
  "numpy==1.26.4",
  "scipy==1.17.1",
  "statsmodels==0.14.6",
  "matplotlib==3.10.8",
  "python-docx==1.2.0",
  "python-dotenv==1.2.2",
  "psycopg2-binary==2.9.12",
  "pyarrow==23.0.1",
  "duckdb==1.5.3",
  "pytest==9.0.2",
  "pygments==2.20.0",
  "pluggy==1.6.0",
  "iniconfig==2.3.0",
]

[tool.setuptools.packages.find]
where = ["src"]
